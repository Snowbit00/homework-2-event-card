<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page">
    <article class="event-card">
      <h1 id="event-title">Ночь в музее</h1>
      <p class="event-info">15 ноября, 18:30</p>
      <p class="event-info">Музей космонавтики, проспект Мира, 111</p>
      <p class="event-info">Вечерняя программа с выставкой и экскурсиями</p>

      <button type="button" id="show-program">Показать программу</button>
      <div id="program" class="program" hidden></div>
      <p id="data-error" class="error" hidden></p>
    </article>

    <form id="service-form" class="service-form" hidden>
      <p class="form-title">Дополнительные услуги</p>
      <p class="service-option">
        <input type="checkbox" id="guide" name="guide">
        <label for="guide">Экскурсия с гидом</label>
      </p>
      <p class="service-option">
        <input type="checkbox" id="audio" name="audio">
        <label for="audio">Аудиогид</label>
      </p>
      <p class="service-option">
        <input type="checkbox" id="catalog" name="catalog">
        <label for="catalog">Каталог выставки</label>
      </p>
      <button type="submit">Рассчитать</button>
      <p id="choice-error" class="error" hidden></p>
    </form>

    <p id="result" class="result" hidden></p>
    <p id="report-json" class="report-json" hidden></p>
  </main>

  <script src="./app.js"></script>
</body>
</html>
